name: Сборка и публикация сайта

on:
  push:
    branches: ["claude/kind-pasteur-jez48z", main, master]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Поставить распаковщик и ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full imagemagick

      # Фотоархив живёт в релизе, а не в репозитории.
      - name: Скачать архив из релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          mkdir -p _release
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*' --dir _release --clobber || echo "У релиза $TAG нет файлов."
          else
            gh release download --pattern '*' --dir _release --clobber || echo "Релизов пока нет — собираю сайт без фото."
          fi
          ls -la _release || true

      - name: Распаковать и подготовить фотографии
        run: bash scripts/prepare-photos.sh _release

      - name: Собрать список фотографий
        run: |
          node scripts/build-gallery.mjs
          rm -rf _release

      - name: Отключить Jekyll
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
